<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shivansh Pandey — AI films & brand creatives</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,800&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0d0c;--ink:#f1ede4;--mute:#9d9a92;--line:#2c2a27;--sand:#d9c7a3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:400 17px/1.6 "Instrument Sans",system-ui,sans-serif;overflow-x:hidden}
h1,h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:.95;letter-spacing:-.03em;font-weight:800}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--sand);outline-offset:3px}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;justify-content:space-between;align-items:center;height:60px}
nav b{font-family:"Bricolage Grotesque";font-weight:800;font-size:18px}
.btn{display:inline-block;padding:14px 26px;border-radius:99px;background:var(--ink);color:var(--bg);font-weight:500;transition:background .2s}
.btn:hover{background:var(--sand)}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line);transition:border-color .2s}
.btn.ghost:hover{border-color:var(--ink)}
.hero{padding:72px 0 96px}
.hero h1{font-size:clamp(56px,12.5vw,176px)}
.hero h1 span{display:block;color:transparent;-webkit-text-stroke:1.5px var(--ink)}
.hero p{margin-top:28px;color:var(--mute);font-size:19px}
.reel{position:relative;aspect-ratio:16/9;margin-top:48px;background:radial-gradient(120% 120% at 20% 10%,#3a3329 0%,#1a1816 45%,#0e0d0c 100%);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:grid;place-items:center}
.reel::before{content:"";position:absolute;inset:7%;border:1px solid rgba(241,237,228,.35);
-webkit-mask:linear-gradient(#000 0 0) top left/28px 28px no-repeat,linear-gradient(#000 0 0) top right/28px 28px no-repeat,linear-gradient(#000 0 0) bottom left/28px 28px no-repeat,linear-gradient(#000 0 0) bottom right/28px 28px no-repeat;
mask:linear-gradient(#000 0 0) top left/28px 28px no-repeat,linear-gradient(#000 0 0) top right/28px 28px no-repeat,linear-gradient(#000 0 0) bottom left/28px 28px no-repeat,linear-gradient(#000 0 0) bottom right/28px 28px no-repeat}
.hud{position:absolute;font-size:13px;letter-spacing:.06em}
.hud.tl{top:11%;left:10%;display:flex;align-items:center;gap:8px}
.hud.tl i{width:9px;height:9px;border-radius:50%;background:#ff3b3b;animation:rec 1.4s steps(2) infinite}
.hud.tr{top:11%;right:10%}.hud.bl{bottom:11%;left:10%;font-variant-numeric:tabular-nums}.hud.br{bottom:11%;right:10%}
@keyframes rec{50%{opacity:0}}
.play{width:92px;height:92px;border-radius:50%;border:1px solid var(--ink);display:grid;place-items:center;background:rgba(14,13,12,.4);cursor:pointer;color:var(--ink);transition:transform .25s,background .25s,color .25s}
.play:hover{transform:scale(1.08);background:var(--sand);color:var(--bg);border-color:var(--sand)}
.play svg{margin-left:5px}
.reel video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}.reel.playing::before,.reel.playing .hud,.reel.playing .play{display:none}.reel .hud,.reel .play,.reel::before{z-index:1}
.contact{padding:96px 0 112px;border-top:1px solid var(--line)}
.contact h2{font-size:clamp(44px,9vw,128px)}
.links{display:flex;flex-wrap:wrap;gap:12px;margin-top:40px}
footer{border-top:1px solid var(--line);padding:28px 0;color:var(--mute);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
@media(max-width:820px){.hud.tr,.hud.br{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<nav><div class="wrap"><b>Shivansh Pandey</b><a class="btn" href="#contact">Contact</a></div></nav>

<header class="hero"><div class="wrap">
<h1>I make brands <span>move.</span></h1>
<p>AI films and visuals for brands.</p>
<div class="reel" id="reel">
<video id="vid" playsinline preload="metadata" poster="poster.jpg" src="ad.mp4"></video>
<div class="hud tl"><i></i>REC</div><div class="hud tr">ISO 100</div>
<div class="hud bl" id="tc">00:00:00:00</div><div class="hud br">AI film · 16:9</div>
<button class="play" aria-label="Play video" id="play"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8z"/></svg></button>
</div>
</div></header>

<section class="contact" id="contact"><div class="wrap">
<h2>Let’s work together.</h2>
<div class="links">
<a class="btn" href="mailto:Shivanshpandey.one@gmail.com">Shivanshpandey.one@gmail.com</a>
<a class="btn ghost" href="tel:+919113135752">+91 9113135752</a>
<a class="btn ghost" href="https://linkedin.com/in/shivansh-pandey" rel="noopener">LinkedIn</a>
</div></div></section>

<footer><div class="wrap"><span>© 2026 Shivansh Pandey</span></div></footer>

<script>
(function(){var t=document.getElementById('tc'),s=Date.now();
function p(n){return String(n).padStart(2,'0')}
setInterval(function(){var d=Date.now()-s,f=Math.floor(d/40)%25,sec=Math.floor(d/1000);
t.textContent=p(Math.floor(sec/3600))+':'+p(Math.floor(sec/60)%60)+':'+p(sec%60)+':'+p(f)},40);
var r=document.getElementById('reel'),v=document.getElementById('vid');
document.getElementById('play').addEventListener('click',function(){r.classList.add('playing');v.controls=true;v.play()});
v.addEventListener('pause',function(){if(v.ended){v.controls=false;r.classList.remove('playing');v.currentTime=0}});
})();
</script>
</body>
</html>
